<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="author" content="Philipe">
    <meta name="description" content="Lista de Tarefas Avançado">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
    </header>

    <section class="todo-section">
        <div class="todo-input">
            <input type="text" id="tarefaInput" placeholder="Adicione uma nova tarefa">
            <button id="addTarefaBtn">Adicionar</button>
        </div>
        <br>
        <div class="todo-filtros">
            <button data-filtro="todas" class="filtro-btn ativo">Todas</button>
            <button data-filtro="pendentes" class="filtro-btn">Pendentes</button>
            <button data-filtro="concluidas" class="filtro-btn">Concluídas</button>
        </div>

        <ul id="listaTarefas">
            <!-- Tarefas serão inseridas aqui pelo JS -->
        </ul>
    </section>

    <footer>
        <p>&copy; Philipe Santos</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
