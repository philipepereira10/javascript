<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Philipe">
    <meta name="description" content="Lista de Tarefas Avançado">
    <title>To Do Avançado</title>
    <!-- css e js -->
    <link rel="stylesheet" href="css/style.css"> 
    <script src="js/script.js" defer></script> <!-- defer para carregar o js apos o navegador ler o codigo todo--> 
    <!-- CDN oficial do Font Awesome Free 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
 <body>
        <div class="todo-container">
            <header>
                <h1>Todo Avançado</h1>
            </header>
        <form id="todo-form">
                <p>Adicione sua tarefa</p>
            <div class="form-control">
                <input type="text" id="todo-input" placeholder="O que você vai fazer?"/>
            <button type="submit">
                <i class="fa-thin fa-plus"></i>
            </button>
            </div>
      </form>
      <form id="edit-form" class="hide">
            <p>Edite sua tarefa</p>
            <div class="form-control">
                <input type="text" id="edit-input" />
                <button type="submit">
                    <i class="fa-solid fa-check-double"></i>
                </button>
            </div>
                <button id="cancel-edit-btn">Cancelar</button>
    </form>
      <div id="toolbar">
            <div id="search">
                <h4>Pesquisar:</h4>
        <form>
            <input type="text" id="search-input" placeholder="Buscar..." />
            <!--  botão não envia o form -->
            <button id="erase-button" type="button">
                <i class="fa-solid fa-delete-left"></i>
            </button>
        </form>
            </div>
    <div id="filter">
        <h4>Filtrar:</h4>
        <select id="filter-select">
            <option value="all">Todos</option>
            <option value="done">Feitos</option>
            <option value="todo">A fazer</option>
        </select>
    </div>
    </div>

      <div id="todo-list">
        <!-- js ira aparecer aqui
         exemplo: 
          
          <div class="todo">
          <h3>Estou fazendo algo aqui...</h3>
          <button class="finish-todo">
            <i class="fa-solid fa-check"></i>
          </button>
          <button class="edit-todo">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button class="remove-todo">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div> -->
        
      </div>
    </div>

    <footer>
        <p>&copy; Philipe Santos</p>
    </footer>
  </body>
</html>
